<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px;
  height: 1920px;
  background: linear-gradient(150deg, #061210 0%, #0E2E1E 45%, #061210 100%);
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  position: relative;
}

/* ── Atmospheric glows ── */
.glow1 {
  position:absolute; width:700px; height:700px;
  top:-180px; right:-150px;
  background: radial-gradient(circle, rgba(15,143,95,0.18) 0%, transparent 65%);
}
.glow2 {
  position:absolute; width:600px; height:600px;
  bottom:300px; left:-150px;
  background: radial-gradient(circle, rgba(15,143,95,0.14) 0%, transparent 65%);
}

/* ── Category tag ── */
.tag {
  position:absolute;
  top: 130px; left: 72px;
  font-size: 26px;
  letter-spacing: 3.5px;
  color: #507060;
  font-weight: 400;
  white-space: nowrap;
}

/* ── Headline ── */
.headline {
  position:absolute;
  top: 202px; left: 72px; right: 72px;
}
.headline .l1 {
  display:block;
  font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif;
  font-size: 108px;
  font-weight: bold;
  color: #FFFFFF;
  line-height: 1.08;
}
.headline .l2 {
  display:block;
  font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif;
  font-size: 108px;
  font-weight: bold;
  color: #E8C86A;
  line-height: 1.08;
  margin-top: 6px;
}

/* ── Subtitle ── */
.sub {
  position:absolute;
  top: 556px; left: 72px; right: 72px;
  font-size: 36px;
  color: #8AADA0;
  line-height: 1.45;
}

/* ── Phone mockup wrapper ── */
.phone-wrap {
  position: absolute;
  top: 710px;
  left: 50%;
  transform: translateX(-50%);
  width: 460px;
  height: 920px;
}

/* Drop shadow behind phone */
.phone-shadow {
  position:absolute;
  top:18px; left:12px;
  width:460px; height:920px;
  background: rgba(0,0,0,0.55);
  border-radius: 54px;
  filter: blur(22px);
}

/* Phone outer frame */
.phone-frame {
  position:relative;
  width:460px; height:920px;
  background: #1A2E22;
  border-radius: 54px;
  border: 4.5px solid #2A4A34;
  overflow: hidden;
}

/* Screen area (inset) */
.screen {
  position:absolute;
  top: 12px; left: 10px;
  width: calc(100% - 20px);
  height: calc(100% - 24px);
  border-radius: 46px;
  overflow: hidden;
  background: #f0ecf8;
}
.screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}

/* Dynamic island */
.island {
  position:absolute;
  top: 18px; left:50%; transform:translateX(-50%);
  width: 90px; height: 22px;
  background: #0A1810;
  border-radius: 11px;
  z-index: 10;
}

/* ── App name (bottom) ── */
.bottom {
  position:absolute;
  bottom: 88px; left: 72px;
}
.divider {
  width: 56px; height: 4px;
  background: #0C2E1A;
  border-radius: 2px;
  margin-bottom: 18px;
}
.appname {
  font-size: 38px;
  font-weight: 700;
  color: #C9A84C;
  letter-spacing: 0.5px;
}
.tagline {
  font-size: 24px;
  color: #507060;
  margin-top: 6px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="tag">BACKUP · GOOGLE DRIVE · AUTO</div>

  <div class="headline">
    <span class="l1">Dữ liệu của bạn,</span>
    <span class="l2">luôn an toàn.</span>
  </div>

  <p class="sub">Tự động sao lưu lên Google Drive lúc 8:00 tối. Khôi phục chỉ một chạm.</p>

  <div class="phone-wrap">
    <div class="phone-shadow"></div>
    <div class="phone-frame">
      <div class="island"></div>
      <div class="screen">
        <img src="file:///C:/Users/Admin/Downloads/New%20folder/Screenshot_2026-06-10-22-00-59-99.jpg" alt="screenshot" />
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="divider"></div>
    <div class="appname">Túi Thần Tài</div>
    <div class="tagline">Quản lý chi tiêu thông minh</div>
  </div>
</body>
</html>
